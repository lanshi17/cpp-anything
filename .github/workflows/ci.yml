name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: toolchain
        run: |
          sudo apt-get update
          # std::print (C++23) needs GCC 14+; generated projects still target GCC 13+.
          sudo apt-get install -y cmake ninja-build g++-14 python3
          g++-14 --version | head -1
          cmake --version | head -1
      - name: configure and build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=g++-14
          cmake --build build -j
      - name: tests
        run: ctest --test-dir build --output-on-failure
      - name: guides are generated from data/matrix.json
        run: ./build/cpp-anything matrix docs --check
      - name: self-check (data, guides, goldens, examples, plugins)
        run: ./build/cpp-anything rsi check
      - name: full loop on the shipped example
        run: |
          ./build/cpp-anything build examples/textkit-cpp
          ./build/cpp-anything diff examples/textkit-cpp
          ./build/cpp-anything gate examples/textkit-cpp
