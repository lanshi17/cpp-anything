name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: toolchain the generated code needs
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ python3
          g++ --version | head -1
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo build --release
      # The guides are generated from data/matrix.json; a stale guide fails here.
      - run: ./target/release/cpp-anything matrix docs --check
      # RSI: data + guides + recorded CLI output + a generated project that is
      # built and replayed. This is the tool checking itself with its own loop.
      - run: ./target/release/cpp-anything rsi check
      - name: full loop on the shipped example
        run: |
          ./target/release/cpp-anything build examples/textkit-cpp
          ./target/release/cpp-anything diff examples/textkit-cpp
          ./target/release/cpp-anything gate examples/textkit-cpp
