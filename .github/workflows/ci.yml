name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    # cpp-anything is built as C++20 modules and imports the standard library;
    # GCC 15 is the first release that ships the `std` module source.
    container: gcc:15
    steps:
      - uses: actions/checkout@v4
      - name: toolchain
        run: |
          apt-get update
          apt-get install -y cmake ninja-build python3 git
          g++ --version | head -1
          cmake --version | head -1
      - name: configure and build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j
      - name: tests
        run: ctest --test-dir build --output-on-failure
      - name: guides are generated from data/matrix.json
        run: ./build/cpp-anything matrix docs --check
      - name: self-check (data, guides, goldens, examples, plugins)
        run: ./build/cpp-anything rsi check
      - name: full loop on the shipped example
        run: |
          ./build/cpp-anything build examples/textkit-cpp
          ./build/cpp-anything diff examples/textkit-cpp
          ./build/cpp-anything gate examples/textkit-cpp
